name: Publish CBE4427/9133 course book

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: course-book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-book.txt
      - name: Install book builder
        run: python -m pip install -r requirements-book.txt
      - name: Import the verified course source once
        id: source
        run: python scripts/bootstrap_source.py
      - name: Build and validate the course website
        run: python scripts/build_book.py
      - name: Save course materials and the compiled GitHub Pages website
        if: github.event_name != 'pull_request'
        run: |
          python scripts/export_pages.py --stage
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dsmles upstream
          if ! git diff --cached --quiet; then
            git commit -m "Update the compiled CBE4427/9133 course website"
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dsmles/_build/html

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy course website
        id: deployment
        uses: actions/deploy-pages@v4
